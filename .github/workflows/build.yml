name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  escritorio:
    name: Escritorio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Compilar y empaquetar
        shell: bash
        run: |
          mkdir -p out pkg
          find desktop-java/src -name "*.java" > fuentes.txt
          javac -encoding UTF-8 -d out @fuentes.txt
          jar --create --file pkg/ResolutorEDO.jar --main-class edo.Main -C out .

      - name: Generar app nativa (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          jpackage --type app-image --name ResolutorEDO \
            --input pkg --main-jar ResolutorEDO.jar --main-class edo.Main \
            --dest dist --java-options -Xmx512m
          tar -czf ResolutorEDO-linux.tar.gz -C dist ResolutorEDO

      - name: Generar app nativa (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          jpackage --type app-image --name ResolutorEDO \
            --input pkg --main-jar ResolutorEDO.jar --main-class edo.Main \
            --dest dist --java-options -Xmx512m
          cd dist && 7z a ../ResolutorEDO-windows.zip ResolutorEDO

      - uses: actions/upload-artifact@v5
        with:
          name: escritorio-${{ runner.os }}
          path: |
            pkg/ResolutorEDO.jar
            ResolutorEDO-linux.tar.gz
            ResolutorEDO-windows.zip
          if-no-files-found: ignore

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ResolutorEDO.apk

      - uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: ResolutorEDO.apk

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [escritorio, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artefactos
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artefactos/ResolutorEDO.jar
            artefactos/ResolutorEDO-linux.tar.gz
            artefactos/ResolutorEDO-windows.zip
            artefactos/ResolutorEDO.apk
